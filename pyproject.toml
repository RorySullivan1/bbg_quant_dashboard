# Tooling configuration only — this is NOT a packaging migration.
# No [build-system]/[project] tables: the app ships via Voila + requirements.txt,
# not as an installable distribution. See .claude/dev_map/v0.6.0.md §4/§F.

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]  # line length is owned by black

[tool.pytest.ini_options]
testpaths = ["tests"]
