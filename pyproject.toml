# Tooling configuration only — this is NOT a packaging migration.
# No [build-system]/[project] tables: the app ships via Voila + requirements.txt,
# not as an installable distribution.

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]  # line length is owned by black

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import src...` resolves under the bare
# `pytest` console script (CI), not just `python -m pytest` (which adds CWD).
pythonpath = ["."]
