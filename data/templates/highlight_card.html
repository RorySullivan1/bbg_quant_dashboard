<div style='border:1px solid {{slate200}};border-radius:6px;padding:10px 12px;background:{{white}};'>
  <div style='font-size:{{micro_size}};font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:{{slate500}};margin-bottom:4px;'>{{label}}</div>
  <div style='font-size:{{display_size}};font-weight:600;color:{{color}};line-height:1.1;'>{{value}}</div>
  <div style='font-size:{{label_size}};color:{{navy}};margin-top:4px;'>{{name}}</div>
  <div style='font-size:{{caption_size}};color:{{slate500}};font-family:{{mono}};'>{{ticker}}</div>
</div>
