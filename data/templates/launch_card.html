<div style='border:1px solid {{border_color}};border-radius:5px;padding:4px 8px;background:{{surface}};margin-bottom:4px;'>
  <div style='display:flex;justify-content:space-between;align-items:baseline;gap:6px;'>
    <span style='font-size:{{label_size}};font-weight:600;color:{{text_color}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>{{name}}</span>
    <span style='font-size:{{micro_size}};color:{{text_muted}};font-family:{{mono}};white-space:nowrap;'>{{ticker}}</span>
  </div>
  <div style='display:flex;justify-content:space-between;align-items:baseline;gap:6px;'>
    <span title='Launched {{live_date}}' style='font-size:{{micro_size}};color:{{text_muted}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>{{meta}} · {{days_ago}}d ago</span>
    <span style='font-size:{{caption_size}};font-weight:600;color:{{accent}};white-space:nowrap;'>{{since_return}} <span style='font-size:{{micro_size}};font-weight:400;color:{{text_muted}};'>since launch</span></span>
  </div>
</div>
