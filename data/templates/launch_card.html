<div style='border:1px solid {{border_color}};border-radius:6px;padding:10px 12px;background:{{surface}};margin-bottom:8px;'>
  <div style='display:flex;justify-content:space-between;align-items:baseline;gap:8px;'>
    <span style='font-size:{{body_size}};font-weight:600;color:{{text_color}};'>{{name}}</span>
    <span style='font-size:{{caption_size}};color:{{text_muted}};font-family:{{mono}};'>{{ticker}}</span>
  </div>
  <div style='font-size:{{caption_size}};color:{{text_muted}};margin-top:2px;'>{{meta}}</div>
  <div style='display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;'>
    <span style='font-size:{{caption_size}};color:{{text_muted}};'>{{live_date}} · {{days_ago}}d ago</span>
    <span style='font-size:{{label_size}};font-weight:600;color:{{accent}};'>{{since_return}}</span>
  </div>
</div>
