<div style='border:1px solid {{border_color}};border-radius:5px;padding:6px 8px;background:{{surface}};margin-bottom:6px;'>
  <div style='display:flex;justify-content:space-between;align-items:baseline;gap:6px;'>
    <span style='font-size:{{label_size}};font-weight:600;color:{{text_color}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>{{name}}</span>
    <span style='font-size:{{micro_size}};color:{{text_muted}};font-family:{{mono}};white-space:nowrap;'>{{ticker}}</span>
  </div>
  <div style='font-size:{{micro_size}};color:{{text_muted}};margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>{{meta}}</div>
  <div style='display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:4px;'>
    <span style='font-size:{{micro_size}};color:{{text_muted}};'>{{live_date}} · {{days_ago}}d ago</span>
    <span style='font-size:{{caption_size}};font-weight:600;color:{{accent}};'>{{since_return}}</span>
  </div>
</div>
