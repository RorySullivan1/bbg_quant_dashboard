<div style='font-family:{{sans}};margin:10px 0 2px 0;'>
  <div style='display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;'>
    <div style='flex:2 1 420px;min-width:0;'>
      <h3 style='margin:0 0 6px 0;font-size:{{h3_size}};color:{{text_color}};'>Market Superlatives <span style='font-weight:400;font-size:{{caption_size}};color:{{text_muted}};'>· {{window_label}} (all-catalog)</span></h3>
      <div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;'>{{superlatives}}</div>
    </div>
    <div style='flex:1 1 220px;min-width:0;'>
      <h3 style='margin:0 0 6px 0;font-size:{{h3_size}};color:{{text_color}};'>New Launches</h3>
      <div>{{launches}}</div>
    </div>
  </div>
</div>
