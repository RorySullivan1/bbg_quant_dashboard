<div style='font-family:{{sans}};margin:14px 0 4px 0;'>
  <div style='display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;'>
    <div style='flex:1 1 360px;min-width:0;'>
      <h3 style='margin:0 0 8px 0;font-size:{{h3_size}};color:{{text_color}};'>Market Superlatives <span style='font-weight:400;font-size:{{caption_size}};color:{{text_muted}};'>· Past Month (all-catalog)</span></h3>
      <div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;'>{{superlatives}}</div>
    </div>
    <div style='flex:1 1 360px;min-width:0;'>
      <h3 style='margin:0 0 8px 0;font-size:{{h3_size}};color:{{text_color}};'>New Launches</h3>
      <div>{{launches}}</div>
    </div>
  </div>
</div>
