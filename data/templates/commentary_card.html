<div style='border:1px solid {{border_color}};border-radius:5px;padding:8px 10px;background:{{surface}};margin-bottom:6px;'>
  <div style='display:flex;justify-content:space-between;align-items:baseline;gap:8px;'>
    <span style='font-size:{{label_size}};font-weight:600;color:{{text_color}};'>{{title}}</span>
    <span style='font-size:{{micro_size}};color:{{text_muted}};font-family:{{mono}};white-space:nowrap;'>{{date}}</span>
  </div>
  <div class='bbg-note-body' style='font-size:{{caption_size}};line-height:1.5;color:{{text_muted}};'>{{paragraphs}}</div>
</div>
