<div class='bbg-superlative' title='{{description}}' style='border:1px solid {{border_color}};border-radius:5px;padding:6px 8px;background:{{surface}};'>
  <div style='font-size:{{micro_size}};font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:{{text_muted}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>{{label}}</div>
  <div style='font-size:{{display_size}};font-weight:700;color:{{color}};line-height:1.15;'>{{value}}</div>
  <div style='font-size:{{caption_size}};color:{{text_color}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>{{name}}</div>
  <div style='font-size:{{micro_size}};color:{{text_muted}};font-family:{{mono}};'>{{ticker}}</div>
</div>
