<div style='border:1px solid {{border_color}};border-radius:6px;padding:10px 12px;background:{{surface}};'>
  <div style='font-size:{{micro_size}};font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:{{text_muted}};margin-bottom:4px;'>{{label}}</div>
  <div style='font-size:{{display_size}};font-weight:600;color:{{color}};line-height:1.1;'>{{value}}</div>
  <div style='font-size:{{label_size}};color:{{text_color}};margin-top:4px;'>{{name}}</div>
  <div style='font-size:{{caption_size}};color:{{text_muted}};font-family:{{mono}};'>{{ticker}} · {{detail}}</div>
</div>
