<div class='bbg-card' style='border:1px solid {{border_color}};border-radius:6px;padding:12px 14px;background:{{surface}};font-family:{{sans}};'>
  <div style='font-size:{{micro_size}};font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:{{text_muted}};'>Strategy Profile</div>
  <div style='font-size:{{hero_size}};font-weight:700;color:{{text_color}};line-height:1.2;margin:2px 0 1px 0;'>{{name}}</div>
  <div style='font-size:{{caption_size}};color:{{accent}};font-family:{{mono}};margin-bottom:10px;'>{{ticker}}</div>
  <div style='display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:{{label_size}};'>
    <span style='color:{{text_muted}};'>Asset Class</span><span style='color:{{text_color}};'>{{asset_class}}</span>
    <span style='color:{{text_muted}};'>Currency</span><span style='color:{{text_color}};'>{{currency}}</span>
    <span style='color:{{text_muted}};'>Return Type</span><span style='color:{{text_color}};'>{{return_type}}</span>
    <span style='color:{{text_muted}};'>Theme</span><span style='color:{{text_color}};'>{{theme}}</span>
    <span style='color:{{text_muted}};'>Category</span><span style='color:{{text_color}};'>{{category}}</span>
    <span style='color:{{text_muted}};'>Launch Date</span><span style='color:{{text_color}};'>{{launch_date}}</span>
  </div>
  <div style='margin-top:10px;border-top:1px solid {{border_color}};padding-top:8px;'>
    <div style='font-size:{{micro_size}};font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:{{text_muted}};margin-bottom:3px;'>Description</div>
    <div style='font-size:{{caption_size}};color:{{text_color}};line-height:1.45;'>{{description}}</div>
  </div>
</div>
