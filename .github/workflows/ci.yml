name: CI

# Lint, format-check, and test.
#
# `push` stays filtered to the trunk (`main`) and to epic integration branches
# (`v*`), so an ordinary feature-branch push does not burn a run on its own —
# its PR covers it.
#
# `pull_request` is deliberately **unfiltered**. Gating it on the base branch
# means a PR into anything else — notably an epic's integration branch — runs
# no CI at all, with no skipped check on the page to notice. That silently
# happened to #198 and #199. Retargeting does not rescue it either: changing a
# PR's base fires `pull_request: edited`, which is not in the default trigger
# set (`opened`, `synchronize`, `reopened`), so the checks list stays empty
# right up to the merge.
#
# Do not add a `branches:` filter to `pull_request` — that is the bug (#202).
on:
  push:
    branches: ["main", "v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Pytest
        run: pytest -q
