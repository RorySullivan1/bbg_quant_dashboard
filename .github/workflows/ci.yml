name: CI

# Lint, format-check, and test on every version integration branch (`v*`, e.g.
# v0.9.0) and `main`, and any PR targeting them. Mirrors the local commands
# documented in CLAUDE.md. The `v*` glob means new integration branches are
# covered without editing this file each cycle (previously pinned to v0.7.5,
# so v0.8.x / v0.9.x PRs ran no CI).
on:
  push:
    branches: ["v*", "main"]
  pull_request:
    branches: ["v*", "main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Pytest
        run: pytest -q
